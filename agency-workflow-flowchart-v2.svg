<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">BBDO West Africa Agency Workflow</title>
  <desc id="desc">A six-stage flowchart moving through Receive, Shape, Make, Check, Release, and Learn, with an approval gate after every stage.</desc>
  <defs>
    <style>
      @font-face { font-family: 'Outfit'; src: url('fonts/Outfit-Variable.ttf') format('truetype'); font-weight: 100 900; }
      text { font-family: 'Outfit', Arial, sans-serif; fill: #231f20; }
      .title { font-size: 68px; font-weight: 800; letter-spacing: -1.5px; }
      .subtitle { font-size: 30px; font-weight: 500; fill: #5c5b60; }
      .stage-number { font-size: 25px; font-weight: 800; fill: #ff0000; }
      .stage-name { font-size: 27px; font-weight: 800; letter-spacing: .3px; }
      .stage-copy { font-size: 20px; font-weight: 450; fill: #4c4a4e; }
      .gate-copy { font-size: 17px; font-weight: 700; text-anchor: middle; }
      .path-label { font-size: 14px; font-weight: 800; fill: #6d6a6e; letter-spacing: 1.4px; }
      .terminal-copy { font-size: 18px; font-weight: 800; text-anchor: middle; fill: #ffffff; }
      .principle { font-size: 18px; font-weight: 800; letter-spacing: 1.1px; }
      .principle-copy { font-size: 15px; font-weight: 450; fill: #5c5b60; }
      .process { fill: #ffffff; stroke: #231f20; stroke-width: 3; }
      .gate { fill: #fff0f0; stroke: #ff0000; stroke-width: 3; }
      .terminal { fill: #231f20; stroke: #231f20; stroke-width: 3; }
      .flow { fill: none; stroke: #231f20; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .return { fill: none; stroke: #ff0000; stroke-width: 2.5; stroke-dasharray: 7 7; marker-end: url(#red-arrow); }
    </style>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#231f20" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#231f20"/>
    </marker>
    <marker id="red-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ff0000"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#f4f6f8"/>
  <rect x="0" y="0" width="18" height="1080" fill="#ff0000"/>

  <text x="72" y="102" class="title">AGENCY WORKFLOW</text>
  <text x="76" y="148" class="subtitle">Six moves. Less chaos.</text>
  <image href="bbdo-west-africa.png" xlink:href="bbdo-west-africa.png" x="1385" y="54" width="455" height="74" preserveAspectRatio="xMidYMid meet"/>
  <line x1="72" y1="188" x2="1840" y2="188" stroke="#d9dadd" stroke-width="2"/>

  <!-- Main flow: top row -->
  <ellipse class="terminal" cx="122" cy="332" rx="78" ry="43"/>
  <text x="122" y="339" class="terminal-copy" fill="#ffffff">NEW JOB</text>
  <path class="flow" d="M200 332 H220"/>

  <g filter="url(#shadow)">
    <rect class="process" x="225" y="257" width="255" height="150" rx="18"/>
    <rect x="225" y="257" width="10" height="150" rx="5" fill="#ff0000"/>
  </g>
  <text x="252" y="300" class="stage-number">01</text>
  <text x="296" y="300" class="stage-name">RECEIVE</text>
  <text x="252" y="343" class="stage-copy"><tspan x="252">Capture the request</tspan><tspan x="252" dy="26">once and in full</tspan></text>

  <path class="flow" d="M480 332 H498"/>
  <polygon class="gate" points="570,270 642,332 570,394 498,332"/>
  <text x="570" y="319" class="gate-copy"><tspan x="570">REQUEST</tspan><tspan x="570" dy="20">ACCEPTED?</tspan></text>
  <path class="return" d="M570 394 V438 H353 V413"/>
  <text x="456" y="457" class="path-label" fill="#ff0000">NO · COMPLETE REQUEST</text>

  <path class="flow" d="M642 332 H658"/>
  <g filter="url(#shadow)">
    <rect class="process" x="660" y="257" width="255" height="150" rx="18"/>
    <rect x="660" y="257" width="10" height="150" rx="5" fill="#ff0000"/>
  </g>
  <text x="687" y="300" class="stage-number">02</text>
  <text x="731" y="300" class="stage-name">SHAPE</text>
  <text x="687" y="343" class="stage-copy"><tspan x="687">Turn it into a clear brief</tspan><tspan x="687" dy="26">and assemble the team</tspan></text>

  <path class="flow" d="M915 332 H933"/>
  <polygon class="gate" points="1005,270 1077,332 1005,394 933,332"/>
  <text x="1005" y="319" class="gate-copy"><tspan x="1005">BRIEF</tspan><tspan x="1005" dy="20">APPROVED?</tspan></text>
  <path class="return" d="M1005 394 V438 H788 V413"/>
  <text x="908" y="457" class="path-label" fill="#ff0000">NO · REFINE BRIEF</text>

  <path class="flow" d="M1077 332 H1093"/>
  <g filter="url(#shadow)">
    <rect class="process" x="1095" y="257" width="255" height="150" rx="18"/>
    <rect x="1095" y="257" width="10" height="150" rx="5" fill="#ff0000"/>
  </g>
  <text x="1122" y="300" class="stage-number">03</text>
  <text x="1166" y="300" class="stage-name">MAKE</text>
  <text x="1122" y="343" class="stage-copy"><tspan x="1122">Develop the best idea</tspan><tspan x="1122" dy="26">for a fair evaluation</tspan></text>

  <path class="flow" d="M1350 332 H1368"/>
  <polygon class="gate" points="1440,270 1512,332 1440,394 1368,332"/>
  <text x="1440" y="319" class="gate-copy"><tspan x="1440">ROUTE</tspan><tspan x="1440" dy="20">SELECTED?</tspan></text>
  <path class="return" d="M1440 270 V226 H1223 V251"/>
  <text x="1284" y="215" class="path-label" fill="#ff0000">NO · DEVELOP FURTHER</text>

  <!-- Turn into second row -->
  <path class="flow" d="M1512 332 H1590 V730 H1360"/>
  <text x="1530" y="320" class="path-label">YES</text>

  <!-- Main flow: bottom row, right to left -->
  <g filter="url(#shadow)">
    <rect class="process" x="1105" y="655" width="255" height="150" rx="18"/>
    <rect x="1350" y="655" width="10" height="150" rx="5" fill="#ff0000"/>
  </g>
  <text x="1132" y="698" class="stage-number">04</text>
  <text x="1176" y="698" class="stage-name">CHECK</text>
  <text x="1132" y="741" class="stage-copy"><tspan x="1132">Review it against</tspan><tspan x="1132" dy="26">the approved brief</tspan></text>

  <path class="flow" d="M1105 730 H1087"/>
  <polygon class="gate" points="1015,668 1087,730 1015,792 943,730"/>
  <text x="1015" y="717" class="gate-copy"><tspan x="1015">HUMAN</tspan><tspan x="1015" dy="20">APPROVAL?</tspan></text>
  <path class="return" d="M1015 668 V624 H1233 V649"/>
  <text x="1072" y="613" class="path-label" fill="#ff0000">NO · CORRECT THE WORK</text>

  <path class="flow" d="M943 730 H927"/>
  <g filter="url(#shadow)">
    <rect class="process" x="670" y="655" width="255" height="150" rx="18"/>
    <rect x="915" y="655" width="10" height="150" rx="5" fill="#ff0000"/>
  </g>
  <text x="697" y="698" class="stage-number">05</text>
  <text x="741" y="698" class="stage-name">RELEASE</text>
  <text x="697" y="741" class="stage-copy"><tspan x="697">Approve, package</tspan><tspan x="697" dy="26">and hand over</tspan></text>

  <path class="flow" d="M670 730 H652"/>
  <polygon class="gate" points="580,668 652,730 580,792 508,730"/>
  <text x="580" y="717" class="gate-copy"><tspan x="580">WORK</tspan><tspan x="580" dy="20">RELEASED?</tspan></text>
  <path class="return" d="M580 792 V836 H798 V811"/>
  <text x="647" y="861" class="path-label" fill="#ff0000">NO · FINISH THE PACKAGE</text>

  <path class="flow" d="M508 730 H492"/>
  <g filter="url(#shadow)">
    <rect class="process" x="235" y="655" width="255" height="150" rx="18"/>
    <rect x="480" y="655" width="10" height="150" rx="5" fill="#ff0000"/>
  </g>
  <text x="262" y="698" class="stage-number">06</text>
  <text x="306" y="698" class="stage-name">LEARN</text>
  <text x="262" y="741" class="stage-copy"><tspan x="262">Review, record</tspan><tspan x="262" dy="26">and reuse</tspan></text>

  <path class="flow" d="M235 730 H217"/>
  <polygon class="gate" points="145,668 217,730 145,792 73,730"/>
  <text x="145" y="717" class="gate-copy"><tspan x="145">LEARNING</tspan><tspan x="145" dy="20">SHARED?</tspan></text>
  <path class="return" d="M145 668 V624 H363 V649"/>
  <text x="190" y="613" class="path-label" fill="#ff0000">NO · RECORD LEARNING</text>

  <path class="flow" d="M145 792 V902"/>
  <text x="158" y="832" class="path-label">YES</text>
  <ellipse class="terminal" cx="145" cy="942" rx="92" ry="40"/>
  <text x="145" y="949" class="terminal-copy" fill="#ffffff">JOB CLOSED</text>

  <!-- Principles strip -->
  <line x1="350" y1="930" x2="1840" y2="930" stroke="#d9dadd" stroke-width="2"/>
  <g transform="translate(382 960)">
    <circle cx="18" cy="18" r="18" fill="#ff0000"/>
    <text x="18" y="24" font-size="18" font-weight="800" text-anchor="middle" fill="#ffffff">1</text>
    <text x="50" y="16" class="principle">ONE TEAM</text>
    <text x="50" y="39" class="principle-copy">The right people for the job</text>
  </g>
  <g transform="translate(745 960)">
    <circle cx="18" cy="18" r="18" fill="#ff0000"/>
    <text x="18" y="24" font-size="18" font-weight="800" text-anchor="middle" fill="#ffffff">2</text>
    <text x="50" y="16" class="principle">ONE BRIEF</text>
    <text x="50" y="39" class="principle-copy">One source of truth</text>
  </g>
  <g transform="translate(1080 960)">
    <circle cx="18" cy="18" r="18" fill="#ff0000"/>
    <text x="18" y="24" font-size="18" font-weight="800" text-anchor="middle" fill="#ffffff">3</text>
    <text x="50" y="16" class="principle">AI INSIDE</text>
    <text x="50" y="39" class="principle-copy">People keep direction and judgment</text>
  </g>
  <g transform="translate(1490 960)">
    <circle cx="18" cy="18" r="18" fill="#ff0000"/>
    <text x="18" y="24" font-size="18" font-weight="800" text-anchor="middle" fill="#ffffff">4</text>
    <text x="50" y="16" class="principle">LEARN ALWAYS</text>
    <text x="50" y="39" class="principle-copy">Every job improves the next</text>
  </g>

  <text x="1840" y="1050" text-anchor="end" font-size="14" font-weight="600" fill="#77747a">BBDO WEST AFRICA · AGENCY WORKFLOW · 2026</text>
</svg>
