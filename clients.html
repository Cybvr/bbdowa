<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clients — BBDOWA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    :root { --red: #e51b23; --ink: #111; --cream: #f4f2ed; --line: #c8c5be; --muted: #6b675f; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--cream); color: var(--ink);
      font-family: "Outfit", Arial, Helvetica, sans-serif;
      display: flex; flex-direction: column;
    }
    .site-nav {
      flex: none; min-height: 88px; padding: 14px clamp(24px, 6vw, 96px);
      background: var(--red); display: flex; align-items: center; justify-content: space-between; gap: 32px;
    }
    .site-nav img { display: block; width: clamp(150px, 18vw, 230px); height: auto; filter: brightness(0) invert(1); }
    .site-nav ul { display: flex; align-items: center; gap: clamp(16px, 2.4vw, 40px); margin: 0; padding: 0; list-style: none; }
    .site-nav li { font-size: 14px; }
    .site-nav a { color: #fff; font-weight: 800; letter-spacing: .06em; text-decoration: none; text-transform: uppercase; }
    .site-nav a:hover, .site-nav a:focus-visible { color: var(--ink); }
    .site-nav a[aria-current="page"] { text-decoration: underline; text-underline-offset: 6px; }
    .site-nav a:focus-visible { outline: 2px solid #fff; outline-offset: 6px; }

    .site-nav li.has-menu { position: relative; }
    .site-nav .trigger {
      border: 0; background: none; padding: 0; cursor: pointer;
      color: #fff; font: inherit; font-size: inherit; font-weight: 800;
      letter-spacing: .06em; text-transform: uppercase;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .site-nav .trigger::after { content: "\25BE"; font-size: .8em; }
    .site-nav .has-menu:hover .trigger, .site-nav .trigger:focus-visible { color: var(--menu-ink, #111); }
    .site-nav .trigger:focus-visible { outline: 2px solid #fff; outline-offset: 6px; }
    .site-nav .has-menu.active .trigger { text-decoration: underline; text-underline-offset: 6px; }
    .site-nav .menu {
      display: none; position: absolute; top: calc(100% + 14px); left: -16px;
      min-width: 200px; padding: 6px 0; background: #111; z-index: 200;
    }
    .site-nav .has-menu:hover .menu, .site-nav .has-menu:focus-within .menu { display: block; }
    .site-nav .menu li { display: block; font-size: 12px; }
    .site-nav .menu a { display: block; padding: 11px 16px; letter-spacing: .1em; }
    .site-nav .menu a:hover, .site-nav .menu a:focus-visible { background: var(--red, #e51b23); color: #fff; }


    main { flex: 1; padding: clamp(30px, 4vw, 56px) clamp(24px, 6vw, 96px) 80px; }
    .lede { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 16px; padding-bottom: 20px; border-bottom: 1px solid var(--ink); }
    h1 { margin: 0; font-size: clamp(38px, 6vw, 86px); line-height: .9; letter-spacing: -.06em; text-transform: uppercase; }
    .lede .note { font-size: 13px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

    .switch { display: flex; gap: 8px; margin: 26px 0 0; }
    .switch button {
      border: 2px solid var(--ink); background: none; color: var(--ink); font: inherit;
      font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
      padding: 11px 18px; cursor: pointer;
    }
    .switch button[aria-selected="true"] { background: var(--ink); color: #fff; }
    .switch button:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }

    .view { margin-top: 30px; }
    h2 { margin: 0 0 6px; font-size: clamp(24px, 3vw, 40px); line-height: 1; letter-spacing: -.05em; text-transform: uppercase; }
    .count { margin: 0 0 18px; font-size: 13px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--red); }

    table { width: 100%; border-collapse: collapse; }
    thead th {
      text-align: left; padding: 10px 12px 10px 0;
      border-bottom: 2px solid var(--ink);
      font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
      white-space: nowrap;
    }
    tbody td { padding: 14px 12px 14px 0; border-bottom: 1px solid var(--line); font-size: clamp(15px, 1.4vw, 19px); line-height: 1.25; vertical-align: top; }
    tbody tr:hover { background: rgba(17,17,17,.04); }
    tbody td:first-child { font-weight: 700; }
    .tag {
      display: inline-block; padding: 4px 10px;
      border: 1px solid var(--ink);
      font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap;
    }
    .tag.live { background: var(--ink); color: #fff; border-color: var(--ink); }
    .tag.pitch { background: var(--red); color: #fff; border-color: var(--red); }
    .wrap { overflow-x: auto; }

    footer {
      flex: none; padding: 34px clamp(24px, 6vw, 96px);
      background: var(--ink); color: #fff;
      display: flex; justify-content: space-between; gap: 24px;
      font-size: 14px; text-transform: uppercase; letter-spacing: .08em;
    }
    @media (max-width: 720px) {
      .site-nav { min-height: 68px; padding-block: 10px; gap: 14px; flex-wrap: wrap; }
      .site-nav img { width: 125px; }
      .site-nav ul { gap: 12px; }
      .site-nav li { font-size: 11px; }
      footer { flex-direction: column; }
    }
  </style>
  <link rel="stylesheet" href="nav-dropdown.css">
</head>
<body>
  <nav class="site-nav" aria-label="Primary navigation">
    <a href="index.html" aria-label="BBDO West Africa home">
      <img src="bbdo-west-africa.png" alt="BBDO West Africa — Do Big Things">
    </a>
    <ul>
      <li><a href="about.html">About</a></li>
      <li><a href="people.html">People</a></li>
      <li><a href="clients.html" aria-current="page">Clients</a></li>
      <li class="has-menu">
        <button type="button" class="trigger" aria-haspopup="true">Products</button>
        <ul class="menu" data-products-menu>
          <li><a href="products.html">All Products</a></li>
          <li><a href="product.html#industry-labs">Industry Labs</a></li>
        </ul>
      </li>
      <li class="has-menu">
        <button type="button" class="trigger" aria-haspopup="true">Workflows</button>
        <ul class="menu">
          <li><a href="agency-workflow.html">Agency</a></li>
          <li><a href="checklist.html">Pitch</a></li>
        </ul>
      </li>
      <li><a href="resources.html">Resources</a></li>
    </ul>
  </nav>

  <main>
    <div class="lede">
      <h1>Clients</h1>
      <span class="note">Current business and live pitches</span>
    </div>

    <div class="switch" role="tablist" aria-label="Client view">
      <button type="button" role="tab" id="tab-all" aria-controls="view" aria-selected="true">All</button>
      <button type="button" role="tab" id="tab-current" aria-controls="view" aria-selected="false" tabindex="-1">Current</button>
      <button type="button" role="tab" id="tab-pitches" aria-controls="view" aria-selected="false" tabindex="-1">Pitches</button>
    </div>

    <div class="view" id="view" role="tabpanel"></div>
  </main>

  <footer>
    <span>BBDO Chaos <span id="today">22 August 2026</span></span>
    <span>Do Big Things</span>
  </footer>

  <script>
    /* ---- edit this list ---- */
    const ACCOUNTS = [
      { name: "Brown-Forman",    brand: "Jack Daniel’s", category: "Spirits",               type: "current", lead: "Samiat Bashorun", stage: "", status: "Active", due: "" },
      { name: "Keizen Games",    brand: "Betano",             category: "Gaming & betting",      type: "current", lead: "Samiat Bashorun", stage: "", status: "Active", due: "" },
      { name: "Proforce Nigeria", brand: "",                  category: "Defence & manufacturing", type: "pitch", lead: "Samiat Bashorun", stage: "", status: "",       due: "" },
      { name: "1 Utility Bank",  brand: "",                   category: "Banking",               type: "pitch",   lead: "Samiat Bashorun", stage: "", status: "",       due: "" }
    ];

    const DASH = "—";
    const view = document.getElementById("view");

    const VIEWS = {
      all: {
        title: "All",
        unit: function (n) { return n + (n === 1 ? " account" : " accounts"); },
        rows: function () { return ACCOUNTS; },
        cols: ["Name", "Brand", "Category", "Type", "Lead"],
        cell: function (a) {
          return [
            a.name,
            a.brand || DASH,
            a.category || DASH,
            a.type === "current"
              ? '<span class="tag live">Current</span>'
              : '<span class="tag pitch">Pitch</span>',
            a.lead || DASH
          ];
        }
      },
      current: {
        title: "Current",
        unit: function (n) { return n + (n === 1 ? " account" : " accounts"); },
        rows: function () { return ACCOUNTS.filter(function (a) { return a.type === "current"; }); },
        cols: ["Client", "Brand", "Category", "Lead", "Status"],
        cell: function (a) {
          return [
            a.name,
            a.brand || DASH,
            a.category || DASH,
            a.lead || DASH,
            a.status ? '<span class="tag live">' + a.status + "</span>" : DASH
          ];
        }
      },
      pitches: {
        title: "Pitches",
        unit: function (n) { return n + " in play"; },
        rows: function () { return ACCOUNTS.filter(function (a) { return a.type === "pitch"; }); },
        cols: ["Prospect", "Category", "Stage", "Lead", "Due"],
        cell: function (a) {
          return [
            a.name,
            a.category || DASH,
            a.stage || DASH,
            a.lead || DASH,
            a.due ? '<span class="tag pitch">' + a.due + "</span>" : DASH
          ];
        }
      }
    };

    function render(key) {
      const v = VIEWS[key];
      const rows = v.rows();
      let html = "<h2>" + v.title + "</h2>";
      html += '<p class="count">' + v.unit(rows.length) + "</p>";
      html += '<div class="wrap"><table><thead><tr>';
      v.cols.forEach(function (c) { html += "<th>" + c + "</th>"; });
      html += "</tr></thead><tbody>";
      rows.forEach(function (a) {
        html += "<tr>";
        v.cell(a).forEach(function (c) { html += "<td>" + c + "</td>"; });
        html += "</tr>";
      });
      html += "</tbody></table></div>";
      view.innerHTML = html;
    }

    const keys = ["all", "current", "pitches"];
    const tabs = keys.map(function (k) { return document.getElementById("tab-" + (k === "pitches" ? "pitches" : k)); });

    function show(i) {
      tabs.forEach(function (t, j) {
        t.setAttribute("aria-selected", j === i ? "true" : "false");
        t.tabIndex = j === i ? 0 : -1;
      });
      view.setAttribute("aria-labelledby", tabs[i].id);
      render(keys[i]);
    }

    tabs.forEach(function (t, i) {
      t.addEventListener("click", function () { show(i); });
      t.addEventListener("keydown", function (e) {
        let n = null;
        if (e.key === "ArrowRight") n = (i + 1) % tabs.length;
        if (e.key === "ArrowLeft") n = (i - 1 + tabs.length) % tabs.length;
        if (n !== null) { e.preventDefault(); show(n); tabs[n].focus(); }
      });
    });

    show(0);

    document.getElementById("today").textContent =
      new Date().toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
  </script>
  <script src="content.js"></script>
  <script src="nav-dropdown.js"></script>
</body>
</html>
