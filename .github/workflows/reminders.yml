# Daily at 9am Lagos time. Sends the weekly summary on Mondays and the monthly
# one on the 1st; other days it does nothing (see scripts/send-reminders.mjs).
# Needs repository secrets: FIREBASE_PROJECT_ID, FIREBASE_CLIENT_EMAIL,
# FIREBASE_PRIVATE_KEY; for email RESEND_API_KEY, EMAIL_FROM, SITE_URL; and
# for browser push NEXT_PUBLIC_WEB_PUSH_PUBLIC_KEY, WEB_PUSH_PRIVATE_KEY.
name: Reminders

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/send-reminders.mjs
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_WEB_PUSH_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_WEB_PUSH_PUBLIC_KEY }}
          WEB_PUSH_PRIVATE_KEY: ${{ secrets.WEB_PUSH_PRIVATE_KEY }}
          WEB_PUSH_SUBJECT: ${{ secrets.WEB_PUSH_SUBJECT }}
