<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Careers | BBDO West Africa</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    :root { --red: #e51b23; --ink: #111; --cream: #f4f2ed; --line: #c8c5be; --muted: #6b675f; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--cream); color: var(--ink);
      font-family: "Outfit", Arial, Helvetica, sans-serif;
      display: flex; flex-direction: column;
    }
    .site-nav {
      flex: none; min-height: 88px; padding: 14px clamp(24px, 6vw, 96px);
      background: var(--red); display: flex; align-items: center; justify-content: space-between; gap: 32px;
    }
    .site-nav img { display: block; width: clamp(150px, 18vw, 230px); height: auto; filter: brightness(0) invert(1); }
    .site-nav ul { display: flex; align-items: center; gap: clamp(14px, 2.2vw, 36px); margin: 0; padding: 0; list-style: none; }
    .site-nav li { font-size: 14px; }
    .site-nav a { color: #fff; font-weight: 800; letter-spacing: .06em; text-decoration: none; text-transform: uppercase; }
    .site-nav a:hover, .site-nav a:focus-visible { color: var(--ink); }
    .site-nav a[aria-current="page"] { text-decoration: underline; text-underline-offset: 6px; }
    .site-nav a:focus-visible { outline: 2px solid #fff; outline-offset: 6px; }
    .site-nav li.has-menu { position: relative; }
    .site-nav .trigger {
      border: 0; background: none; padding: 0; cursor: pointer;
      color: #fff; font: inherit; font-size: inherit; font-weight: 800;
      letter-spacing: .06em; text-transform: uppercase;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .site-nav .trigger::after { content: "\25BE"; font-size: .8em; }
    .site-nav .has-menu:hover .trigger, .site-nav .trigger:focus-visible { color: var(--ink); }
    .site-nav .trigger:focus-visible { outline: 2px solid #fff; outline-offset: 6px; }
    .site-nav .menu {
      display: none; position: absolute; top: calc(100% + 14px); left: -16px;
      min-width: 200px; padding: 6px 0; background: var(--ink); z-index: 200;
    }
    .site-nav .has-menu:hover .menu, .site-nav .has-menu:focus-within .menu { display: block; }
    .site-nav .menu li { display: block; font-size: 12px; }
    .site-nav .menu a { display: block; padding: 11px 16px; letter-spacing: .1em; }
    .site-nav .menu a:hover, .site-nav .menu a:focus-visible { background: var(--red); color: #fff; }

    main { flex: 1; padding: clamp(44px, 7vw, 96px) clamp(24px, 6vw, 96px) 100px; }
    .lede { display: flex; align-items: end; justify-content: space-between; gap: 32px; margin-bottom: clamp(44px, 7vw, 84px); }
    h1 { margin: 0; font-size: clamp(64px, 13vw, 180px); line-height: .82; letter-spacing: -.07em; text-transform: uppercase; }
    .lede p { max-width: 27ch; margin: 0 0 8px; font-size: clamp(18px, 2vw, 26px); line-height: 1.2; }
    .count { margin: 0 0 16px; color: var(--red); font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .job-head, .job-row { display: grid; grid-template-columns: minmax(280px, 1.55fr) minmax(190px, 1fr) minmax(100px, .55fr) 88px; gap: 24px; }
    .job-head {
      padding: 12px 0; border-bottom: 2px solid var(--ink);
      color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
    }
    .job-row { align-items: center; padding: 24px 0; border-bottom: 1px solid var(--line); }
    .job-title { margin: 0; font-size: clamp(24px, 2.8vw, 40px); line-height: 1; letter-spacing: -.04em; text-transform: uppercase; }
    .job-meta { font-size: clamp(15px, 1.3vw, 18px); line-height: 1.3; }
    .mobile-label { display: none; }
    .status { justify-self: start; padding: 5px 9px; background: var(--red); color: #fff; font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .empty { padding: 28px 0; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--line); font-size: 18px; }
    footer {
      flex: none; padding: 34px clamp(24px, 6vw, 96px);
      background: var(--ink); color: #fff; display: flex; justify-content: space-between; gap: 24px;
      font-size: 14px; text-transform: uppercase; letter-spacing: .08em;
    }
    @media (max-width: 900px) {
      .job-head, .job-row { grid-template-columns: minmax(220px, 1.5fr) minmax(160px, 1fr) 90px 80px; gap: 16px; }
    }
    @media (max-width: 720px) {
      .site-nav { min-height: 68px; padding-block: 10px; gap: 14px; flex-wrap: wrap; }
      .site-nav img { width: 125px; }
      .site-nav ul { gap: 12px; }
      .site-nav li { font-size: 11px; }
      .lede { align-items: start; flex-direction: column; }
      .job-head { display: none; }
      .job-row { grid-template-columns: 1fr 1fr; gap: 18px 20px; padding: 24px 0; }
      .job-title { grid-column: 1 / -1; }
      .mobile-label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      .status { align-self: end; }
      footer { flex-direction: column; }
    }
  </style>
  <link rel="stylesheet" href="nav-dropdown.css">
</head>
<body>
  <nav class="site-nav" aria-label="Primary navigation">
    <a href="index.html" aria-label="BBDO West Africa home">
      <img src="bbdo-west-africa.png" alt="BBDO West Africa">
    </a>
    <ul>
      <li><a href="about.html">About</a></li>
      <li><a href="people.html">People</a></li>
      <li><a href="careers.html" aria-current="page">Careers</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li class="has-menu">
        <button type="button" class="trigger" aria-haspopup="true">Products</button>
        <ul class="menu" data-products-menu>
          <li><a href="products.html">All Products</a></li>
          <li><a href="product.html#industry-labs">Industry Labs</a></li>
        </ul>
      </li>
      <li class="has-menu">
        <button type="button" class="trigger" aria-haspopup="true">Workflows</button>
        <ul class="menu">
          <li><a href="agency-workflow.html">Agency</a></li>
          <li><a href="checklist.html">Pitch</a></li>
        </ul>
      </li>
      <li><a href="resources.html">Resources</a></li>
    </ul>
  </nav>

  <main>
    <div class="lede">
      <h1>Careers</h1>
      <p>Open roles across our Lagos studio.</p>
    </div>

    <p class="count" id="job-count"></p>
    <div class="job-head" aria-hidden="true">
      <span>Role</span><span>Department</span><span>Location</span><span>Status</span>
    </div>
    <section id="job-list" aria-label="Open positions"></section>
    <noscript><p class="empty">Enable JavaScript to view current openings.</p></noscript>
  </main>

  <footer>
    <span>BBDO West Africa <span id="today">22 August 2026</span></span>
    <span>Do Big Things</span>
  </footer>

  <script src="content.js"></script>
  <script src="jobs.js"></script>
  <script>
    const JOBS = window.BBDOWA_JOBS.openings;
    const list = document.getElementById("job-list");

    if (JOBS.length) {
      JOBS.forEach(function (job) {
        const row = document.createElement("article");
        row.className = "job-row";
        row.id = job.slug;

        const title = document.createElement("h2");
        title.className = "job-title";
        title.textContent = job.title;

        const department = document.createElement("div");
        department.className = "job-meta";
        department.innerHTML = '<span class="mobile-label">Department</span>';
        department.append(document.createTextNode(job.department));

        const location = document.createElement("div");
        location.className = "job-meta";
        location.innerHTML = '<span class="mobile-label">Location</span>';
        location.append(document.createTextNode(job.location));

        const status = document.createElement("span");
        status.className = "status";
        status.textContent = job.status;

        row.append(title, department, location, status);
        list.append(row);
      });
    } else {
      list.innerHTML = '<p class="empty">There are no open positions right now.</p>';
    }

    document.getElementById("job-count").textContent =
      JOBS.length + (JOBS.length === 1 ? " opening" : " openings");
    document.getElementById("today").textContent =
      new Date().toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
  </script>
  <script src="nav-dropdown.js"></script>
</body>
</html>
