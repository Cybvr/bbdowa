<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products — BBDO West Africa</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    :root { --red: #e51b23; --ink: #111; --cream: #f4f2ed; --line: #c8c5be; --muted: #6b675f; }
    body { margin: 0; background: var(--cream); color: var(--ink); font-family: "Outfit", Arial, sans-serif; }
    .site-nav { min-height: 88px; padding: 14px clamp(24px, 6vw, 96px); background: var(--red); display: flex; align-items: center; justify-content: space-between; gap: 32px; }
    .site-nav img { display: block; width: clamp(150px, 18vw, 230px); height: auto; filter: brightness(0) invert(1); }
    .site-nav ul { display: flex; align-items: center; gap: clamp(18px, 3vw, 48px); margin: 0; padding: 0; list-style: none; }
    .site-nav li { position: relative; font-size: 14px; }
    .site-nav a, .trigger { color: #fff; font: inherit; font-weight: 800; letter-spacing: .06em; text-decoration: none; text-transform: uppercase; }
    .trigger { border: 0; background: none; padding: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .trigger::after { content: "\25BE"; font-size: .8em; }
    .site-nav a:hover, .site-nav a:focus-visible, .trigger:hover, .trigger:focus-visible { color: var(--ink); }
    .has-menu.active .trigger { text-decoration: underline; text-underline-offset: 6px; }
    .menu { display: none !important; position: absolute; top: calc(100% + 14px); left: -16px; min-width: 200px; padding: 6px 0 !important; background: #111; z-index: 20; }
    .menu::before { content: ""; position: absolute; right: 0; bottom: 100%; left: 0; height: 14px; }
    .has-menu:hover .menu, .has-menu:focus-within .menu { display: block !important; }
    .menu li { display: block; font-size: 12px; }
    .menu a { display: block; padding: 11px 16px; }
    .menu a:hover, .menu a:focus-visible { background: var(--red); color: #fff; }

    main { min-height: calc(100vh - 164px); padding: clamp(48px, 7vw, 96px) clamp(24px, 6vw, 96px) 100px; }
    .lede { display: flex; align-items: end; justify-content: space-between; gap: 32px; margin-bottom: clamp(40px, 6vw, 72px); }
    h1 { margin: 0; font-size: clamp(64px, 13vw, 180px); line-height: .82; letter-spacing: -.07em; text-transform: uppercase; }
    .lede p { max-width: 28ch; margin: 0 0 8px; font-size: clamp(18px, 2vw, 26px); line-height: 1.2; }

    .count { margin: 0 0 16px; font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--red); }
    .wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      text-align: left; padding: 12px 16px 12px 0;
      border-bottom: 2px solid var(--ink);
      font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
      white-space: nowrap;
    }
    tbody td { padding: 22px 16px 22px 0; border-bottom: 1px solid var(--line); font-size: clamp(16px, 1.4vw, 20px); line-height: 1.25; vertical-align: middle; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: rgba(17,17,17,.04); }
    tbody td.name a {
      color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 10px;
      font-size: clamp(22px, 2.4vw, 34px); line-height: .98; letter-spacing: -.045em; text-transform: uppercase; font-weight: 700;
    }
    .product-wordmark { display: block; width: clamp(120px, 13vw, 180px); height: 54px; object-fit: contain; object-position: left center; mix-blend-mode: multiply; }
    tbody td.name a::after { content: " →"; color: var(--red); white-space: nowrap; }
    tbody td.name strong { font-size: clamp(22px, 2.4vw, 34px); line-height: .98; letter-spacing: -.045em; text-transform: uppercase; font-weight: 700; }
    tbody td.name a:hover, tbody td.name a:focus-visible { color: var(--red); }
    .owner { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
    .avatar { width: 40px; height: 40px; flex: none; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 900; letter-spacing: -.03em; }
    .cats { display: flex; flex-wrap: wrap; gap: 6px; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .cats span { border: 1px solid var(--ink); padding: 4px 10px; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
    .status { display: inline-block; padding: 5px 9px; background: var(--ink); color: #fff; font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .status.active { background: var(--red); }
    td.date { white-space: nowrap; font-variant-numeric: tabular-nums; }

    footer { padding: 28px clamp(24px, 6vw, 96px); background: #111; color: #fff; display: flex; justify-content: space-between; gap: 24px; text-transform: uppercase; letter-spacing: .08em; font-size: 14px; }
    @media (max-width: 720px) {
      .site-nav { min-height: 68px; padding-block: 10px; gap: 14px; flex-wrap: wrap; }
      .site-nav img { width: 125px; }
      .site-nav ul { gap: 14px; }
      .site-nav li { font-size: 11px; }
      .lede { align-items: start; flex-direction: column; }
      footer { flex-direction: column; }
    }
  </style>
  <link rel="stylesheet" href="nav-dropdown.css">
</head>
<body>
  <nav class="site-nav" aria-label="Primary navigation">
    <a href="index.html" aria-label="BBDO West Africa home"><img src="bbdo-west-africa.png" alt="BBDO West Africa"></a>
    <ul>
      <li><a href="about.html">About</a></li>
      <li><a href="people.html">People</a></li>
      <li><a href="careers.html">Careers</a></li>
      <li><a href="clients.html">Clients</a></li>
      <li class="has-menu active">
        <button type="button" class="trigger" aria-haspopup="true">Products</button>
        <ul class="menu" data-products-menu>
          <li><a href="products.html" aria-current="page">All Products</a></li>
          <li><a href="product.html#industry-labs">Industry Labs</a></li>
        </ul>
      </li>
      <li class="has-menu">
        <button type="button" class="trigger" aria-haspopup="true">Workflows</button>
        <ul class="menu">
          <li><a href="agency-workflow.html">Agency</a></li>
          <li><a href="checklist.html">Pitch</a></li>
        </ul>
      </li>
      <li><a href="resources.html">Resources</a></li>
    </ul>
  </nav>

  <main>
    <div class="lede">
      <h1>Products</h1>
      <p>Shared tools, platforms and agency-owned initiatives.</p>
    </div>

    <p class="count" id="count"></p>

    <div class="wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Status</th>
            <th>Owner</th>
            <th>Users</th>
            <th>Created / target date</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <footer><span>BBDO Chaos <span id="today">22 August 2026</span></span><span>Do Big Things</span></footer>

  <script src="content.js"></script>
  <script>
    const PRODUCTS = window.CHAOS_CONTENT.products;

    function initials(n) {
      return n.split(/\s+/).slice(0, 2).map(function (w) { return w[0]; }).join("").toUpperCase();
    }
    function longDate(iso) {
      if (!iso) return "—";
      const p = iso.split("-");
      return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]))
        .toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
    }

    document.getElementById("rows").innerHTML = PRODUCTS.map(function (p) {
      const destination = p.url || ("product.html#" + p.slug);
      const owner = p.owner
        ? '<span class="owner"><span class="avatar" aria-hidden="true">' + p.owner.avatar + '</span>' + p.owner.name + '</span>'
        : '—';
      const name = '<a href="' + destination + '"><img class="product-wordmark" src="' + p.avatar + '" alt="' + p.name + '"></a>';
      const productDate = p.created || p.targetDate;
      const date = productDate
        ? '<time datetime="' + productDate + '">' + longDate(productDate) + '</time>'
        : '—';
      return '<tr data-link="' + destination + '" data-product-slug="' + p.slug + '">' +
        '<td class="name">' + name + '</td>' +
        '<td><span class="status ' + p.status + '">' + p.status + '</span></td>' +
        '<td>' + owner + '</td>' +
        '<td><span class="cats">' + p.users.map(function (user) { return "<span>" + user + "</span>"; }).join("") + '</span></td>' +
        '<td class="date">' + date + '</td>' +
        '</tr>';
    }).join("");

    Array.prototype.forEach.call(document.querySelectorAll("tbody tr[data-link]"), function (tr) {
      tr.addEventListener("click", function (e) {
        if (e.target.closest("a")) return;
        window.location.href = tr.getAttribute("data-link");
      });
    });

    document.getElementById("count").textContent =
      PRODUCTS.length + (PRODUCTS.length === 1 ? " product" : " products");

    document.getElementById("today").textContent =
      new Date().toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
  </script>
  <script src="nav-dropdown.js"></script>
</body>
</html>
